name: Windows tests and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Create repository environment
        shell: pwsh
        run: ./scripts/setup.ps1 -PythonExecutable (Get-Command python).Source
      - name: Python tests
        shell: pwsh
        run: ./scripts/run_tests.ps1
      - name: Native build
        shell: pwsh
        run: ./scripts/build_native.ps1
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: EU4-AutoSave-Assistant
          path: dist/*.zip
          if-no-files-found: error
